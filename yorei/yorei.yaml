# パーリ語句の用例集. scripts/yorei.py --save が書き出す.
# 1 用例が 1 項目. ref = 出典, text = 原文 (VRI の表記のまま), ja = 訳,
# file / para = 原文のある VRI XML のファイル名と段落番号, added = 用例を作った日,
# model = 訳を書いたモデル. words (見出し語), note (補足), pts (PTS の巻・頁)
# は任意.
# 並びは経蔵, 律蔵, 論蔵, 註, 復註, Vism の順でスクリプトが整える.
# 手で直すときは文字列を "..." で囲んだ形のままにする (スクリプトはこの形しか
# 読まない).

- ref: "DN 9 (VRI §434)"
  text: "‘‘Taṃ kiṃ maññasi, poṭṭhapāda, nanu evaṃ sante sappāṭihīrakataṃ bhāsitaṃ sampajjatī’’ti?"
  ja: "ポッタパーダよ, これをどう思うか. そうであるなら, (その) 発言は根拠のあるものということになるのではないか"
  words: ["sampajjati", "sappāṭihīrakata"]
  file: "s0101m.mul8"
  para: 434
  added: "2026/11/01"
  model: "Claude Fable 5.1"

- ref: "MN 79 (VRI §272)"
  text: "‘‘Taṃ kiṃ maññasi, udāyi – nanu evaṃ sante, tassa purisassa appāṭihīrakataṃ bhāsitaṃ sampajjatī’’ti?"
  ja: "ウダーイよ, これをどう思うか. そうであるなら, その男の発言は根拠のないものということになるのではないか"
  words: ["sampajjati", "appāṭihīrakata"]
  file: "s0202m.mul2"
  para: 272
  added: "2026/11/01"
  model: "Claude Fable 5.1"

- ref: "MN 79 (VRI §275)"
  text: "‘‘Na khvāssa, udāyi, ettāvatā ekantasukho loko sacchikato hoti; ākāravatītveva sā paṭipadā ekantasukhassa lokassa sacchikiriyāyā’’ti."
  ja: "ウダーイよ, 彼にとってこれだけでは, ひたすら楽な世界が実証されたことにはならない. むしろそれは, ひたすら楽な世界を実証するための根拠のある実践なのである"
  words: ["ākāravant"]
  file: "s0202m.mul2"
  para: 275
  added: "2026/11/01"
  model: "Claude Fable 5.1"

- ref: "MN 79 (VRI §277)"
  text: "Iti hidaṃ sakuludāyissa paribbājakassa parisā sakuludāyiṃ paribbājakaṃ antarāyamakāsi bhagavati brahmacariyeti."
  ja: "このようにして, 遍歴行者サクルダーインの会衆は, 遍歴行者サクルダーインに対して, 世尊のもとでの梵行について妨げをなしたのである"
  words: ["antarāya"]
  note: "antarāyamakāsi は antarāyaṃ + akāsi. 人の対格 (sakuludāyiṃ paribbājakaṃ) + 事柄の処格 (brahmacariye)"
  file: "s0202m.mul2"
  para: 277
  added: "2026/11/01"
  model: "Claude Fable 5.1"

- ref: "MN 80 (VRI §281)"
  text: "Tesamidaṃ bhāsitaṃ hassakaṃyeva sampajjati, nāmakaṃyeva sampajjati, rittakaṃyeva sampajjati, tucchakaṃyeva sampajjatī’’ti."
  ja: "彼らのこの発言は, まさに笑うべきものになり, まさに名ばかりのものになり, まさに空虚なものになり, まさに虚妄なものになる"
  words: ["sampajjati"]
  file: "s0202m.mul2"
  para: 281
  added: "2026/11/03"
  model: "Claude Fable 5.1"

- ref: "MN 80 (VRI §281)"
  text: "tassa vuddhimanvāya indriyānaṃ paripākamanvāya tāni bandhanāni mucceyyuṃ;"
