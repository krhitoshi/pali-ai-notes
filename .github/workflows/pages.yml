# 対訳と調査ノートを静的 HTML にビルドして GitHub Pages に公開する
# main への push ごとに scripts/build_site.rb で public/ を生成し,
# その中身をそのまま Pages の成果物としてデプロイする (public/ はコミットしない)
# 事前にリポジトリの Pages 設定で Source を GitHub Actions にしておく必要がある

name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# デプロイは同時に 1 つだけ. 実行中のデプロイは途中で取り消さない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Ruby のバージョンは .ruby-version に従う
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: actions/configure-pages@v6

      - name: Build site
        run: bundle exec ruby scripts/build_site.rb

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
