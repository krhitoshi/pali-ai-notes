# 対訳と調査ノートを静的 HTML にビルドして GitHub Pages に公開する
# main への push ごとに scripts/build_site.rb で public/ を生成し,
# その中身をそのまま Pages の成果物としてデプロイする (public/ はコミットしない)
# 事前にリポジトリの Pages 設定で Source を GitHub Actions にしておく必要がある
#
# サイトの出力に関係しないファイルだけを変えた push ではデプロイしない (issue #45).
# build_site.rb が読むのは各セクションの md, README.md, build_site.rb 自身,
# Gemfile / Gemfile.lock / .ruby-version で, それ以外を変えても出力は変わらない.
# paths は全体 ("**") を対象にしたうえで, 関係しないと分かっているパスを
# "!" で外す形にしている. ここに挙げていないパスは従来どおりデプロイされる
# ため, セクションを増やしたときにこのファイルを直し忘れてもサイトが
# 更新されない事故にならない. 後ろのパターンが優先されるので, "!scripts/**" の
# あとに "scripts/build_site.rb" を置いて対象に戻している.
# ドットで始まる入力 (.ruby-version とこのファイル) は, "**" がドットで始まる
# パスに一致するかどうかを GitHub のドキュメントで確かめられなかったため,
# 個別にも挙げている.
# 絞り込みで飛ばされた push のあとでも workflow_dispatch で手動実行できる

name: Deploy site to Pages

on:
  push:
    branches: [main]
    paths:
      - "**"
      - ".ruby-version"
      - ".github/workflows/pages.yml"
      - "!.claude/**"
      - "!docs/**"
      - "!scripts/**"
      - "scripts/build_site.rb"
      - "!templates/**"
      - "!.obsidian/**"
      - "!CLAUDE.md"
      - "!system_prompt*.md"
      - "!pali_glossary.md"
      - "!.gitignore"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# デプロイは同時に 1 つだけ. 実行中のデプロイは途中で取り消さない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Ruby のバージョンは .ruby-version に従う
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: actions/configure-pages@v6

      - name: Build site
        run: bundle exec ruby scripts/build_site.rb

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
